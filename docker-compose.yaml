services:
  sonos-exporter:
    build: .
    container_name: sonos-exporter
    restart: unless-stopped
    ports:
      - "9814:9814"
    # SONOS_IP: IP of any Sonos player in the household
    command: ["--sonos-ip", "${SONOS_IP:?set SONOS_IP to a Sonos player IP}", "--interval", "60"]
    # Unprivileged ICMP (preferred, no root needed)
    sysctls:
      - net.ipv4.ping_group_range=0 65535
    # Fallback for kernels without ping sockets; remove if not needed
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9814/health')\""]
      interval: 1m30s
      timeout: 10s
      retries: 3
