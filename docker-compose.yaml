services:
  sonos-exporter:
    build: .
    container_name: sonos-exporter
    restart: unless-stopped
    ports:
      - "9814:9814"
    command: ["--sonos-ip", "${SONOS_IP:-100.88.88.41}", "--interval", "60"]
    cap_add:
      - NET_RAW  
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9814/health || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3


networks:
  monitoring:
    driver: bridge
