services:
  sonos-exporter:
    build: .
    container_name: sonos-exporter
    restart: unless-stopped
    ports:
      - "9814:9814"
    environment:
      # Optional: override via env
      SONOS_IP: "100.88.88.194"
    command: ["--sonos-ip", "${SONOS_IP:-127.0.0.1}", "--interval", "60"]
    cap_add:
      - NET_RAW
      # - NET_ADMIN
    # security_opt:
    #   - apparmor=unconfined      
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9814/health || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3


networks:
  monitoring:
    driver: bridge
